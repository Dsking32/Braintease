services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: braintease
      POSTGRES_USER: braintease
      POSTGRES_PASSWORD: braintease_dev
    ports:
      - "5432:5432"
    volumes:
      - braintease-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braintease -d braintease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  braintease-postgres: